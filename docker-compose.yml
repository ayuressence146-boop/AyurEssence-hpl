# ============================================================
# AyurEssence — Docker Compose
# Services: backend (FastAPI) + frontend (React/Nginx)
# Database: Supabase PostgreSQL (external, via DATABASE_URL)
# ============================================================

services:

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ayuressence-backend
    restart: unless-stopped
    env_file:
      - .env                        # loads DATABASE_URL, JWT_SECRET, etc.
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8000:8000"                 # expose for direct API access / testing
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ayur-net

  # ── React Frontend (Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayuressence-frontend
    restart: unless-stopped
    ports:
      - "80:80"                     # main app entry point
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ayur-net

networks:
  ayur-net:
    driver: bridge
